<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064E3B">
  <meta name="description" content="Golden Financial Services customer website and loan portal. Loans in Malawi Kwacha.">
  <title>Golden Financial Services — Customer Website</title>
  <link rel="icon" href="public/assets/favicon.ico" sizes="any">
  <!-- Branch-root GitHub Pages publishing uses this entrypoint. The Actions
       artifact publishes public/ directly, so no redirect is needed there. -->
  <meta http-equiv="refresh" content="0; url=./public/">
  <script>
    (function () {
      var target = new URL('./public/', window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    }());
  </script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F8F6;color:#064E3B;font-family:system-ui,sans-serif}
    main{max-width:32rem;padding:2rem;text-align:center}img{width:180px;max-width:70%;height:auto}a{display:inline-block;padding:.8rem 1.3rem;border-radius:.6rem;background:#C9A227;color:#241C00;font-weight:750;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <img src="public/assets/logo.png" alt="Golden Financial Services">
    <h1>Opening your customer website…</h1>
    <p>If you are not redirected automatically, continue below.</p>
    <a href="./public/">Open Golden Financial Services</a>
  </main>
</body>
</html>
