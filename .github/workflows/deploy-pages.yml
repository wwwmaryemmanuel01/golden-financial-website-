name: Deploy website to GitHub Pages

# Publish only public/, never the repository README/source, as the website.
# On static GitHub Pages the portal is a labelled device-local sandbox, not a
# shared database or an admin-system bridge. A configured, deployed Node backend
# is required for authoritative accounts and records (see README).
# The root index.html also supports the existing branch-root Pages setting.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static site
        run: |
          # The shared financial core lives in public/js/core.js (loaded by both
          # the browser and the Node backend), so public/ is fully self-contained.
          node tests/pages-entrypoint.js
          test -f public/index.html
          test -f public/js/core.js
          test -f public/css/rebuild.css
          test -f public/js/portal-extra.js
          grep -q 'css/rebuild.css' public/index.html
          grep -q 'js/portal-extra.js' public/index.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
